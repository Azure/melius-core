name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt
          pip install --no-deps .

      - name: Lint package (flake8)
        run: flake8 --config .flake8 melius

      - name: Lint tests (flake8)
        run: flake8 --config tests/.flake8_tests tests

      - name: Run unit tests (pytest)
        run: pytest tests

      - name: Build wheel
        run: pip wheel --no-deps --use-pep517 . -w dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: melius-core-wheel
          path: dist/*.whl
          if-no-files-found: error
